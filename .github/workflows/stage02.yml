name: Lughzdan verification
on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'stage-03-advanced-arabic-games', 'stage-04-offline-content-sync', 'stage-05-06-visual-knowledge']
  pull_request:
concurrency:
  group: lughzdan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug :app:assembleRelease :core:content:test :core:database:testDebugUnitTest :core:game-engine:test :data:testDebugUnitTest :core:datastore:testDebugUnitTest :core:network:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --stacktrace
        working-directory: apps/android
      - run: gradle :app:testReleaseUnitTest --tests com.lughzdan.app.ReleaseContentSmokeTest --stacktrace
        working-directory: apps/android
      - run: python scripts/summarize_android_tests.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-evidence
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-release-arm64
          path: apps/android/app/build/outputs/apk/release/*.apk
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm audit --audit-level=high
        working-directory: services/api
      - run: npm run typecheck && npm run build && npm test
        working-directory: services/api
      - run: node --import tsx scripts/verify-production.ts
        working-directory: services/api
        env:
          PUBLIC_API_URL: https://br-purple-frost-baw74zwb-catalog.compute.c-8.eu-central-1.aws.neon.tech/
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py && python scripts/check_content.py && python scripts/check_secrets.py && python scripts/validate_opening_pack.py
      - run: pip install -r packages/media/requirements.txt
      - run: python -m unittest discover -s packages/media/tests -v
      - run: python -m unittest discover -s packages/knowledge/tests -v
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm audit --audit-level=high
        working-directory: services/api
  offline-device:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: scripts/device_acceptance.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage03-device-evidence-${{ matrix.api }}
          path: apps/android/artifacts/stage03/
  owner-signed-candidate:
    needs: [android, backend, contracts, offline-device]
    if: github.repository == 'Mtzallqmy/Loazdan' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Sign candidate with the original owner key
        env:
          OWNER_KEYSTORE_BASE64: ${{ secrets.LUGHZDAN_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          LUGHZDAN_STORE_PASSWORD: ${{ secrets.LUGHZDAN_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OWNER_KEYSTORE_BASE64" || { echo 'Missing original keystore secret: LUGHZDAN_KEYSTORE_BASE64'; exit 1; }
          test -n "$LUGHZDAN_STORE_PASSWORD" || { echo 'Missing original keystore password secret: LUGHZDAN_STORE_PASSWORD'; exit 1; }
          export LUGHZDAN_KEYSTORE="$RUNNER_TEMP/lughzdan-owner.jks"
          trap 'rm -f "$LUGHZDAN_KEYSTORE"' EXIT
          printf '%s' "$OWNER_KEYSTORE_BASE64" | base64 --decode > "$LUGHZDAN_KEYSTORE"
          chmod 600 "$LUGHZDAN_KEYSTORE"
          unset OWNER_KEYSTORE_BASE64
          (cd apps/android && gradle :app:assembleRelease --console=plain)
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: 3dce653ad682a411d929cf5067153bff1b75d5d1944eb3a2e84d3785de76dd7c' "$RUNNER_TEMP/certificate.txt"
          python scripts/verify_release_apk.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E "package: name='com.lughzdan.app'.*versionCode='101'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'26'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p candidate
          cp "$APK" candidate/Lughzdan-1.1.0-rc1-ARM64-owner-signed.apk
          (cd candidate && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: owner-signed-candidate-arm64
          path: candidate/
          if-no-files-found: error
